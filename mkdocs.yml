site_name: Open Notebook Lab
site_description: Collaborative course and subject knowledge repository.
repo_name: OpenNotebookLab/notes
repo_url: https://github.com/OpenNotebookLab/notes

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - fenced_code
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/print.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Courses:
      - Overview: courses/index.md
      - Deep Learning:
          - Course Home: courses/deep-learning/index.md
          - Math Foundations: courses/deep-learning/topics/math-foundations.md
          - Topic 01: courses/deep-learning/topics/01-topic-placeholder.md
          - Review: courses/deep-learning/review.md
          - Cheat Sheet: courses/deep-learning/cheatsheet.md
          - References: courses/deep-learning/references.md
      - Reinforcement Learning:
          - Course Home: courses/reinforcement-learning/index.md
          - Topic 01: courses/reinforcement-learning/topics/01-topic-placeholder.md
          - Review: courses/reinforcement-learning/review.md
          - Cheat Sheet: courses/reinforcement-learning/cheatsheet.md
          - References: courses/reinforcement-learning/references.md
  - Subjects:
      - Overview: subjects/index.md
